name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: BrightnessTray
          path: target/release/BrightnessTray.exe
