[package]
name = "brightness-tray"
version = "1.0.0"
edition = "2021"
description = "Universal monitor brightness control from the Windows tray (DDC/CI, WMI and software dimming)"
license = "MIT"
repository = "https://github.com/PriyanshuGeTRekT/Universal-Monitor-Brightness-control"

[[bin]]
name = "BrightnessTray"
path = "src/main.rs"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
